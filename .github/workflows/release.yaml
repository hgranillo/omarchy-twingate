name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Repository code runs here, where the token cannot write.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test tests/*.test.js

  # This job never executes repository code, so the write token is not exposed
  # to whatever the tag happens to point at.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Never interpolate the tag into shell source: a tag may legitimately be
      # named v$(command), and ${{ }} would paste it in as code.
      - name: Resolve and check the tag
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing tag $RAW_TAG: expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          printf 'TAG=%s\n' "$RAW_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Tag must match manifest.json
        run: |
          version=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Skip a release that already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the commits since the previous tag
        if: steps.existing.outputs.exists == 'false'
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
            compare="**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$previous...$TAG"
          else
            range="$TAG"
            compare=""
          fi
          {
            echo "NOTES<<EOF_NOTES"
            git log --no-merges --pretty=format:'- %s' "$range" | grep -vE '^- (Release|Bump version)' || true
            if [ -n "$compare" ]; then
              printf '\n\n%s\n' "$compare"
            fi
            echo "EOF_NOTES"
          } >> "$GITHUB_ENV"

      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES"
